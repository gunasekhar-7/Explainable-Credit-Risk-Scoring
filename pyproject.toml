[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-credit-risk-scoring"
version = "1.0.0"
description = "Explainable credit risk scoring: WoE scorecard + XGBoost with SHAP explanations"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "xgboost==3.2.0",
    "shap==0.51.0",
    "mlflow==3.17.1",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "matplotlib==3.11.2",
    "jupyter==1.1.1",
    "redis==5.2.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "PLC", "SIM", "TRY", "RUF"]
ignore = ["E501", "B008", "PLC0415", "TRY003"]
fixable = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]
